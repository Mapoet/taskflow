name: Ubuntu

on: [push, pull_request]

jobs:
  skill-stage10-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AGENT_SKILL_SCRIPT_ALLOWLIST: /bin/sh
      AGENT_TOOL_ALLOWLIST: ""
      GITHUB_TOKEN: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false
    - name: Install sandbox runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        test -x /usr/bin/unshare
        test -x /usr/bin/bwrap
    - name: Configure Stage 10 Skill and public API gates
      run: >-
        cmake -S . -B build-stage10-ci
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_STANDARD=20
        -DTF_BUILD_AGENT_FRAMEWORK=ON
        -DTF_BUILD_TESTS=ON
        -DAGENT_BUILD_EXAMPLES=ON
    - name: Build Stage 1-10 Skill and example targets
      run: |
        cmake --build build-stage10-ci --parallel 10 --target \
          skillctl \
          agent_framework_examples \
          test_public_header_layout \
          test_skill_registry \
          test_skill_manifest_v1 \
          test_skill_policy_runtime \
          test_skill_process_sandbox \
          test_skill_agent_loop_policy \
          test_skill_capability_runtime \
          test_skill_workflow \
          test_skill_lifecycle \
          test_skill_cli_contract \
          test_skill_doctor \
          test_skill_test_runner \
          test_skill_cli_lifecycle \
          test_skill_package_gate \
          test_skill_resource_contract \
          test_skill_resource_access \
          test_skill_resource_cache \
          test_skill_reference \
          test_skill_artifact_import \
          test_skill_model \
          test_skill_config \
          test_skill_audit \
          test_skill_cli_resources \
          test_skill_supply_chain_contract \
          test_skill_archive \
          test_skill_sbom \
          test_skill_signature \
          test_skill_package_trust_gate \
          test_skill_remote_registry \
          test_skill_cli_supply_chain \
          test_skill_platform_stress \
          test_skill_registry_scale \
          test_resource_runtime
    - name: Run offline Stage 10 quality gates
      run: >-
        ctest --test-dir build-stage10-ci
        -L 'skill-(cli-contract|test-runner|package-reproducibility|security-negative|resource-management|cache-security|reference-retrieval|model-admission|package-archive|signature-security|sbom-contract|registry-supply-chain|supply-chain-e2e|platform-stress|resource-leak|registry-scale)|stage10-(examples|header-layout)'
        --output-on-failure
    - name: Verify installed Skill platform and modular headers
      run: |
        cmake --install build-stage10-ci --prefix "$RUNNER_TEMP/taskflow-stage10"
        test -x "$RUNNER_TEMP/taskflow-stage10/bin/skillctl"
        test -f "$RUNNER_TEMP/taskflow-stage10/include/agent/core/types.hpp"
        test -f "$RUNNER_TEMP/taskflow-stage10/include/agent/skills/skill_config.hpp"
        test -f "$RUNNER_TEMP/taskflow-stage10/include/agent/skills/skill_audit.hpp"
        test -f "$RUNNER_TEMP/taskflow-stage10/include/node/nodes.hpp"
        test ! -e "$RUNNER_TEMP/taskflow-stage10/include/agent/types.hpp"
        test ! -e "$RUNNER_TEMP/taskflow-stage10/include/agent/skill_config.hpp"
        test -f "$RUNNER_TEMP/taskflow-stage10/share/agent_framework/schemas/skill-manifest-v1.schema.json"

  debug-test-cpp20-extended:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_PROFILER=ON -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    # Full ctest includes Agent Framework M3 targets: a2a_contract_json, a2a_contract_sse,
    # a2a_contract_loopback (when TF_BUILD_AGENT_FRAMEWORK=ON).
    - name: test
      run: cd build ; ctest --output-on-failure
  
  release-test-cpp20-extended:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure
  
  leak-test-cpp20-extended:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-fsanitize=address -fsanitize=leak -g" -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure
  
  #undefined-test:
  #  runs-on: ubuntu-latest
  #  steps:
  #  - uses: actions/checkout@v3
  #  - name: cmake
  #    run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-fsanitize=undefined -g"
  #  - name: build
  #    run: cmake --build build --parallel 10
  #  - name: test
  #    run: cd build ; ctest -j 10 --output-on-failure
  
  tsan-test-cpp20-extended:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure

###############################################################################
# C++ 20 standard test:
###############################################################################
  
  debug-test-cpp20:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_PROFILER=ON -DCMAKE_CXX_STANDARD=20 -DAGENT_BUILD_EXAMPLES=ON
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure
    - name: WP2.6 M3 contract gate
      run: cd build && ctest -R 'a2a_contract_json|a2a_contract_sse' --output-on-failure
    - name: A2A Tier B loopback
      run: cd build && AGENT_A2A_INTEGRATION_LOOPBACK=1 AGENT_CLIENT_USE_LEGACY_REST=0 AGENT_TOOL_ALLOWLIST= ctest -R a2a_loopback_integration --output-on-failure
    - name: Phase 2 vertical integration gates
      run: cd build && ctest -L 'phase2-(cli|a2a|quality|multi-agent|recovery)-e2e' --output-on-failure
    - name: Phase 3 offline gate
      run: |
        count=$(ctest --test-dir build -N -L phase3-offline | awk '/Test +#[0-9]+:/ {n++} END {print n+0}')
        test "$count" -ge 13
        ctest --test-dir build -L phase3-offline --output-on-failure
    - name: Phase 4 offline gate
      run: |
        count=$(ctest --test-dir build -N -L phase4-offline | awk '/Test +#[0-9]+:/ {n++} END {print n+0}')
        test "$count" -ge 32
        ctest --test-dir build -L phase4-offline --output-on-failure

  release-test-cpp20:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure
    - name: Phase 3 offline Release gate
      run: |
        count=$(ctest --test-dir build -N -L phase3-offline | awk '/Test +#[0-9]+:/ {n++} END {print n+0}')
        test "$count" -ge 10
        ctest --test-dir build -L phase3-offline --output-on-failure
    - name: Phase 4 offline Release gate
      run: |
        count=$(ctest --test-dir build -N -L phase4-offline | awk '/Test +#[0-9]+:/ {n++} END {print n+0}')
        test "$count" -ge 32
        ctest --test-dir build -L phase4-offline --output-on-failure

  phase3-faiss-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Faiss CPU dependencies
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
    - name: Configure Release Faiss contract
      run: >-
        cmake -S . -B build-phase3-faiss
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_STANDARD=20
        -DAGENT_BUILD_FAISS=ON
    - name: Build Release Faiss contract
      run: cmake --build build-phase3-faiss --parallel 2 --target test_vectorstore_faiss_contract
    - name: Phase 3 Faiss gate
      run: |
        count=$(ctest --test-dir build-phase3-faiss -N -L phase3-faiss | awk '/Test +#[0-9]+:/ {n++} END {print n+0}')
        test "$count" -eq 1
        ctest --test-dir build-phase3-faiss -L phase3-faiss --output-on-failure
  
  leak-test-cpp20:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-fsanitize=address -fsanitize=leak -g" -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure
  
  tsan-test-cpp20:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: cmake
      run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
    - name: build
      run: cmake --build build --parallel 10
    - name: test
      run: cd build ; ctest --output-on-failure

  # WP2.U U-0：无显示环境仅编译 ImGui 目标（FetchContent GLFW + ImGui）
  wpu-imgui-compile:
    runs-on: ubuntu-latest
    env:
      AGENT_RICH_UI_CI: compile_only
    steps:
    - uses: actions/checkout@v3
    - name: Install GLFW/X11 build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev
    - name: configure
      run: cmake -S . -B build-wpu -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DAGENT_BUILD_IMGUI=ON
    - name: build imgui_agent_demo
      run: cmake --build build-wpu --parallel 10 --target imgui_agent_demo
